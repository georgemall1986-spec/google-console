plugins {
    
    id 'com.android.application'
    
}



def releaseKeystorePath = System.getenv('FILEFLIP_KEYSTORE_PATH')

def releaseStorePassword = System.getenv('FILEFLIP_KEYSTORE_PASSWORD')

def releaseKeyAlias = System.getenv('FILEFLIP_KEY_ALIAS')

def releaseKeyPassword = System.getenv('FILEFLIP_KEY_PASSWORD')



android {
    
    namespace 'com.hggaming.fileflip'
    
    compileSdk 35
    

    
    defaultConfig {
        
        applicationId 'com.hggaming.fileflip'
        
        minSdk 24
        
        targetSdk 35
        
        versionCode 1
        
        versionName '1.0'
        
    }
    

    
    signingConfigs {
        
        release {
            
            if (releaseKeystorePath && releaseStorePassword && releaseKeyAlias && releaseKeyPassword) {
                
                storeFile file(releaseKeystorePath)
                
                storePassword releaseStorePassword
                
                keyAlias releaseKeyAlias
                
                keyPassword releaseKeyPassword
                
            }
            
        }
        
    }
    

    
    buildTypes {
        
        release {
            
            minifyEnabled false
            
            if (releaseKeystorePath && releaseStorePassword && releaseKeyAlias && releaseKeyPassword) {
                
                signingConfig signingConfigs.release
                
            }
            
        }
        
    }
    

    
    compileOptions {
        
        sourceCompatibility JavaVersion.VERSION_17
        
        targetCompatibility JavaVersion.VERSION_17
        
    }
    
}







































