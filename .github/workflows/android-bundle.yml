name: Android bundle build



on:

  workflow_dispatch:

  push:

    branches: [main]

    paths: ['android/**', '.github/workflows/android-bundle.yml']



permissions:

  contents: read



concurrency:

  group: android-bundle-${{ github.ref }}

  cancel-in-progress: false



jobs:

  build:

    runs-on: ubuntu-24.04

    timeout-minutes: 30

    steps:

      - name: Check out source

        uses: actions/checkout@v4

      - name: Set up Java 17

        uses: actions/setup-java@v4

        with:

          distribution: temurin

          java-version: '17'

          cache: gradle

      - name: Set up Android SDK

        uses: android-actions/setup-android@v3

      - name: Validate Android source

        shell: bash

        run: |

          set -euo pipefail

          test -f android/gradlew || { echo 'Android source is not present yet: add android/gradlew and the Android project before running a build.' >&2; exit 2; }

          test -f android/settings.gradle -o -f android/settings.gradle.kts

          chmod +x android/gradlew

      - name: Build release bundle

        working-directory: android

        run: ./gradlew bundleRelease --stacktrace

      - name: Upload release bundle

        if: success()

        uses: actions/upload-artifact@v4

        with:

          name: android-release-${{ github.run_number }}

          path: android/**/build/outputs/bundle/**/*.aab

          if-no-files-found: error

          retention-days: 14



# This workflow builds artifacts only. Google Play production submission remains confirmation-controlled.
