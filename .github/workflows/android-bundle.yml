name: Android bundle build



on:

  workflow_dispatch:
  
  push:
  
    branches: [main]
    
    paths: ['android/**', '.github/workflows/android-bundle.yml']
    


permissions:

  contents: read
  


concurrency:

  group: android-bundle-${{ github.ref }}
  
  cancel-in-progress: false
  


jobs:

  build:
  
    runs-on: ubuntu-24.04
    
    timeout-minutes: 30
    
    env:
    
      FILEFLIP_KEYSTORE_BASE64: ${{ secrets.FILEFLIP_KEYSTORE_BASE64 }}
      
      FILEFLIP_KEYSTORE_PASSWORD: ${{ secrets.FILEFLIP_KEYSTORE_PASSWORD }}
      
      FILEFLIP_KEY_ALIAS: ${{ secrets.FILEFLIP_KEY_ALIAS }}
      
      FILEFLIP_KEY_PASSWORD: ${{ secrets.FILEFLIP_KEY_PASSWORD }}
      
    steps:
    
      - name: Check out source
      
        uses: actions/checkout@v4
        


      - name: Set up Java 17
      
        uses: actions/setup-java@v4
        
        with:
        
          distribution: temurin
          
          java-version: '17'
          
          cache: gradle
          


      - name: Set up Gradle 8.9
      
        uses: gradle/actions/setup-gradle@v4
        
        with:
        
          gradle-version: '8.9'
          


      - name: Verify hosted Android SDK
      
        shell: bash
        
        run: |
        
          set -euo pipefail
          
          test -n "${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          
          test -x "${ANDROID_HOME:-${ANDROID_SDK_ROOT}}/platform-tools/adb"
          


      - name: Validate Android source
      
        shell: bash
        
        run: |
        
          set -euo pipefail
          
          test -f android/settings.gradle
          
          test -f android/app/build.gradle
          
          test -f android/app/src/main/AndroidManifest.xml
          


      - name: Decode release keystore when configured
      
        if: env.FILEFLIP_KEYSTORE_BASE64 != ''
        
        run: |
        
          set -euo pipefail
          
          printf '%s' "$FILEFLIP_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/fileflip-upload.jks"
          
          chmod 600 "$RUNNER_TEMP/fileflip-upload.jks"
          
          echo "FILEFLIP_KEYSTORE_PATH=$RUNNER_TEMP/fileflip-upload.jks" >> "$GITHUB_ENV"
          


      - name: Build release bundle
      
        working-directory: android
        
        run: gradle bundleRelease --stacktrace
        


      - name: Upload release bundle
      
        if: success()
        
        uses: actions/upload-artifact@v4
        
        with:
        
          name: android-release-${{ github.run_number }}
          
          path: android/**/build/outputs/bundle/**/*.aab
          
          if-no-files-found: error
          
          retention-days: 14
          


# Build-only: Google Play production submission remains confirmation-controlled.




























































