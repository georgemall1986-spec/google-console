name: Reusable Android Play release

on:
  workflow_call:
    inputs:
      package_name:
        description: Google Play package name
        required: true
        type: string
      track:
        description: Play track for this run
        required: false
        default: internal
        type: string
      production:
        description: Whether this run may publish to production
        required: false
        default: false
        type: boolean
    secrets:
      PLAY_SERVICE_ACCOUNT_JSON:
        required: true
      ANDROID_KEYSTORE_BASE64:
        required: true
      ANDROID_KEYSTORE_PASSWORD:
        required: true
      ANDROID_KEY_ALIAS:
        required: true
      ANDROID_KEY_PASSWORD:
        required: true

  workflow_dispatch:
    inputs:
      package_name:
        description: Google Play package name
        required: true
        type: string
      track:
        description: Play track
        required: true
        default: internal
        type: choice
        options: [internal, alpha, beta, production]
      production:
        description: Request production release (requires the production environment approver)
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: play-release-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

env:
  GRADLE_USER_HOME: ${{ github.workspace }}/.gradle

jobs:
  validate:
    name: Build and validate signed AAB
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      aab_path: ${{ steps.locate.outputs.aab_path }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Node for React Native or Expo projects
        if: hashFiles('package.json', 'yarn.lock', 'package-lock.json', 'pnpm-lock.yaml') != ''
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install JavaScript dependencies when applicable
        if: hashFiles('package.json') != ''
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f package-lock.json ]]; then npm ci
          elif [[ -f yarn.lock ]]; then corepack enable && yarn install --immutable
          elif [[ -f pnpm-lock.yaml ]]; then corepack enable && pnpm install --frozen-lockfile
          else npm install
          fi

      - name: Locate Android project
        id: android
        shell: bash
        run: |
          set -euo pipefail
          if [[ -x android/gradlew ]]; then
            echo "dir=android" >> "$GITHUB_OUTPUT"
          elif [[ -x gradlew ]]; then
            echo "dir=." >> "$GITHUB_OUTPUT"
          else
            echo 'No executable gradlew found. Add a native Android project or run Expo prebuild before using this workflow.' >&2
            exit 1
          fi

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "${{ steps.android.outputs.dir }}/release.keystore"
          test -s "${{ steps.android.outputs.dir }}/release.keystore"

      - name: Run checks
        working-directory: ${{ steps.android.outputs.dir }}
        run: ./gradlew check --stacktrace

      - name: Build signed release bundle
        working-directory: ${{ steps.android.outputs.dir }}
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew bundleRelease --stacktrace \
            -Pandroid.injected.signing.store.file="$PWD/release.keystore" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

      - name: Locate AAB
        id: locate
        working-directory: ${{ steps.android.outputs.dir }}
        shell: bash
        run: |
          set -euo pipefail
          aab=$(find . -type f -path '*/build/outputs/bundle/*/*.aab' | head -n 1)
          test -n "$aab"
          echo "aab_path=${{ steps.android.outputs.dir }}/${aab#./}" >> "$GITHUB_OUTPUT"

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: aab-${{ github.run_id }}
          path: ${{ steps.locate.outputs.aab_path }}
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish to Google Play
    needs: validate
    if: ${{ inputs.production || inputs.track != 'production' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: ${{ inputs.production && 'production' || 'internal-testing' }}
    steps:
      - name: Download AAB artifact
        uses: actions/download-artifact@v4
        with:
          name: aab-${{ github.run_id }}
          path: release

      - name: Upload to Google Play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ inputs.package_name }}
          releaseFiles: release/**/*.aab
          track: ${{ inputs.track }}
          status: completed
          inAppUpdatePriority: ${{ inputs.production && 5 || 2 }}

      - name: Write release summary
        run: |
          {
            echo '## Google Play release submitted'
            echo "- Repository: ${{ github.repository }}"
            echo "- Package: ${{ inputs.package_name }}"
            echo "- Track: ${{ inputs.track }}"
            echo "- Production approval: ${{ inputs.production && 'required and granted by GitHub environment' || 'not requested' }}"
          } >> "$GITHUB_STEP_SUMMARY"
# secret-name correction
